services:
  hardhat:
    build:
      context: ./backend
    restart: unless-stopped
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const http=require('http');const req=http.request({hostname:'127.0.0.1',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));req.write('{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}');req.end();"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  deploy:
    build:
      context: ./backend
    depends_on:
      hardhat:
        condition: service_healthy
    environment:
      RPC_URL: http://hardhat:8545
      ADDRESS_FILE: /app/runtime/address.json
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - runtime-data:/app/runtime
    restart: "no"
    command: sh -c "npx hardhat run scripts/deploy.js --network localhost"

  app:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      hardhat:
        condition: service_healthy
      deploy:
        condition: service_completed_successfully
    environment:
      PORT: 9200
      RPC_URL: http://hardhat:8545
      ADDRESS_FILE: /app/runtime/address.json
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - runtime-data:/app/runtime
    ports:
      - "9200:9200"
    command: sh -c "npm install && npm run dev"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    working_dir: /app
    depends_on:
      app:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:9200
      VITE_SOCKET_URL: http://localhost:9200
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "9100:9100"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 9100"

volumes:
  runtime-data:
  backend-node-modules:
  frontend-node-modules:
