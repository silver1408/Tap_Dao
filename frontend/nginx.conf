# Tap DAO — static SPA served for https://tap.kiyoai.in
#
# This container is only the UI. The browser calls the API directly at
# https://tap-back.kiyoai.in, so no /api proxy is configured here: the backend
# owns CORS, cookies and the WebSocket handshake.

server {
    listen 9100;
    listen [::]:9100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded proposal images are served by the API, so /uploads is simply a
    # normal SPA path here.
    include /etc/nginx/nginx-security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so they are safe to cache hard.
    # Only add_header is used: `expires` would emit a second, conflicting
    # Cache-Control header that caches (and Cloudflare) have to guess about.
    location /assets/ {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The HTML shell must never be cached, or members keep loading a stale
    # bundle after a redeploy. The security headers are repeated because a
    # location with its own add_header does not inherit the server-level ones.
    location = /index.html {
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    client_max_body_size 1m;
}
