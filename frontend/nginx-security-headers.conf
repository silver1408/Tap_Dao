# Security headers for the Tap DAO UI (https://tap.kiyoai.in).
#
# This lives in its own file because nginx's add_header is NOT inherited once a
# location block declares its own add_header. Every block that sets a header must
# include this snippet, otherwise the response silently loses these headers.
#
# TLS is terminated by the Cloudflare Tunnel, so HSTS is emitted here.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# NFC cards drive the kiosk, so WebAuthn and the Web NFC API are allowed.
add_header Permissions-Policy "publickey-credentials-get=(self), webauthn=(self)" always;
